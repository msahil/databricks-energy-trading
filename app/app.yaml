# Databricks Apps runtime: https://docs.databricks.com/aws/en/dev-tools/databricks-apps/app-runtime
# Development: `python app.py` (Dash debug server + hot reload). Production: gunicorn app:server
command:
  - python
  - app.py

# Optional Unity Catalog defaults for Statement Execution (see app/uc_sql.py).
env:
  - name: DASH_DEBUG
    value: "false"
  - name: DEMO_UC_CATALOG
    value: "energy_utilities"
  - name: DEMO_UC_SCHEMA
    value: "energy_trading2"
  # Optional: notebook 04 space_id + workspace host for /short-term/insights deep link
  # - name: GENIE_SPACE_ID
  #   value: "01f158459b24135e8ad11dea6bd0773c"
  # - name: DATABRICKS_HOST
  #   value: "https://e2-demo-field-eng.cloud.databricks.com"
